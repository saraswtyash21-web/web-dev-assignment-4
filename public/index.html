<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Secure Connect - Chat Test Client</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 24px auto; padding: 0 12px; }
    input, button { padding: 8px; font-size: 14px; }
    #log { border: 1px solid #ccc; height: 320px; overflow-y: auto; padding: 8px; margin: 12px 0; background: #fafafa; }
    .sys { color: #888; font-style: italic; }
    .row { display: flex; gap: 8px; margin-bottom: 8px; }
    .row input { flex: 1; }
    #typing { height: 18px; color: #666; font-size: 13px; }
  </style>
</head>
<body>
  <h2>Secure Connect Chat</h2>
  <p>Login via Postman (<code>POST /api/auth/login</code>), paste the JWT below, then connect.</p>

  <div class="row">
    <input id="token" placeholder="Paste JWT token here" />
    <button id="connect">Connect</button>
  </div>
  <div class="row">
    <input id="room" placeholder="Room name (default: general)" />
    <button id="join">Join room</button>
  </div>
  <div>Online: <b id="online">-</b></div>
  <div id="log"></div>
  <div id="typing"></div>
  <div class="row">
    <input id="msg" placeholder="Type a message" disabled />
    <button id="send" disabled>Send</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    let socket;
    let typingTimer;

    function add(text, cls) {
      const div = document.createElement('div');
      if (cls) div.className = cls;
      div.textContent = text;
      $('log').appendChild(div);
      $('log').scrollTop = $('log').scrollHeight;
    }

    $('connect').onclick = () => {
      if (socket) socket.disconnect();
      socket = io({ auth: { token: $('token').value.trim() } });

      socket.on('connect', () => {
        add('Connected to server', 'sys');
        $('msg').disabled = false;
        $('send').disabled = false;
      });
      socket.on('connect_error', (e) => add(e.message, 'sys'));
      socket.on('disconnect', () => add('Disconnected', 'sys'));
      socket.on('system', (t) => add(t, 'sys'));
      socket.on('online_users', (list) => ($('online').textContent = list.join(', ') || '-'));
      socket.on('chat_message', (m) => add(`[${new Date(m.createdAt).toLocaleTimeString()}] ${m.sender}: ${m.text}`));
      socket.on('typing', ({ user, isTyping }) => ($('typing').textContent = isTyping ? `${user} is typing...` : ''));
    };

    $('join').onclick = () => socket && socket.emit('join_room', $('room').value);

    function send() {
      const text = $('msg').value;
      if (!text.trim() || !socket) return;
      socket.emit('chat_message', text);
      socket.emit('typing', false);
      $('msg').value = '';
    }
    $('send').onclick = send;
    $('msg').addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
    $('msg').addEventListener('input', () => {
      if (!socket) return;
      socket.emit('typing', true);
      clearTimeout(typingTimer);
      typingTimer = setTimeout(() => socket.emit('typing', false), 1000);
    });
  </script>
</body>
</html>
